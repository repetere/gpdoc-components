name: Standalone profile checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  opendoc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix opendoc --ignore-scripts
      - run: npm run check:web --prefix opendoc
      - run: npm test --prefix opendoc
  opendoc-postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: opendoc_test
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: opendoc_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U opendoc_test -d opendoc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix opendoc --ignore-scripts
      - name: Identify this test service
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          address=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$POSTGRES_CONTAINER_ID")
          printf 'OPENDOC_PG_EXPECTED_SERVER_ADDRESS=%s\n' "$address" >> "$GITHUB_ENV"
      - name: Test isolated PostgreSQL store
        run: npm run test:postgres --prefix opendoc
        env:
          OPENDOC_PG_INTEGRATION: '1'
          DATABASE_URL: postgres://opendoc_test:synthetic-test-only@127.0.0.1:5432/opendoc_test
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Verify fresh POC configuration safety
        run: python -m unittest discover -s opendoc/deploy/lightsail -p test_prepare.py -v
  opendoc-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated TLS reference files
        run: node opendoc/deploy/prepare-reference.mjs --synthetic-client
      - name: Build non-root server image
        run: docker compose -f opendoc/deploy/compose.yml build app
      - name: Verify production-only runtime
        run: |
          docker run --rm --entrypoint node opendoc-reference:local -e "if(process.getuid()===0)process.exit(1);require('pg');try{require.resolve('oidc-provider');process.exit(1)}catch(e){if(e.code!=='MODULE_NOT_FOUND')throw e}"
      - name: Initialize isolated database and explicit runtime grants
        run: |
          docker compose -f opendoc/deploy/compose.yml up -d --wait postgres
          for component in accounts documents live sessions; do
            docker compose -f opendoc/deploy/compose.yml --profile admin run --rm admin init --config /run/opendoc/server.json --component "$component"
          done
          docker compose -f opendoc/deploy/compose.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U opendoc_admin -d opendoc < opendoc/deploy/runtime-grants.sql
      - name: Exercise packaged server readiness, TLS and restart
        run: |
          docker compose -f opendoc/deploy/compose.yml up -d --wait app
          docker compose -f opendoc/deploy/compose.yml exec -T app node src/server-health.mjs /run/opendoc/server.json
          curl --fail --cacert opendoc/deploy/.reference/tls/ca.crt https://localhost:8443/readyz
          docker compose -f opendoc/deploy/compose.yml restart app
          docker compose -f opendoc/deploy/compose.yml up -d --wait app
          docker compose -f opendoc/deploy/compose.yml exec -T app node src/server-health.mjs /run/opendoc/server.json
      - name: Cleanup isolated reference
        if: always()
        run: docker compose -f opendoc/deploy/compose.yml --profile admin down -v --remove-orphans
  reference-layout:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Check responsive reference layout
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: python tests/browser/test_reference_layout.py
  claude-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Claude Code validator
        run: npm install --prefix "$RUNNER_TEMP/claude-validator" --no-save @anthropic-ai/claude-code@2.1.322
      - name: Validate plugin and marketplace
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
        run: |
          "$RUNNER_TEMP/claude-validator/node_modules/.bin/claude" plugin validate --strict plugins/gpdoc-markdown
          "$RUNNER_TEMP/claude-validator/node_modules/.bin/claude" plugin validate --strict .claude-plugin/marketplace.json
