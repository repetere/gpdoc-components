name: Standalone profile checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  reference-layout:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Check responsive reference layout
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: python tests/browser/test_reference_layout.py
  claude-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Claude Code validator
        run: npm install --prefix "$RUNNER_TEMP/claude-validator" --no-save @anthropic-ai/claude-code@2.1.322
      - name: Validate plugin and marketplace
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
        run: |
          "$RUNNER_TEMP/claude-validator/node_modules/.bin/claude" plugin validate --strict plugins/gpdoc-markdown
          "$RUNNER_TEMP/claude-validator/node_modules/.bin/claude" plugin validate --strict .claude-plugin/marketplace.json
