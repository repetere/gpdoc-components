name: Publish OpenDoc server image
on:
  workflow_run:
    workflows: [Standalone profile checks]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: opendoc-image-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Confirm tested commit is current main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current="$(gh api repos/repetere/gpdoc-components/commits/main --jq .sha)"
          if [ "$current" = "$TESTED_SHA" ]; then echo 'publish=true' >> "$GITHUB_OUTPUT"; else echo 'publish=false' >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.current.outputs.publish == 'true'
      - uses: docker/login-action@v3
        if: steps.current.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.current.outputs.publish == 'true'
        with:
          context: .
          file: opendoc/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/repetere/opendoc:sha-${{ github.event.workflow_run.head_sha }}
            ghcr.io/repetere/opendoc:latest
          provenance: true
          sbom: true
